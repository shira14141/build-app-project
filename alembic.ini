# Alembic (database migrations) settings.
# NOTE: keep this file ASCII-only - on Windows Alembic reads it with the system code page.
#
# Usually there is no need to run migrations by hand: the server upgrades the database
# automatically on startup (server/migrate.py) and backs up a SQLite file first.
#
# Manual commands (from the project folder):
#   python -m alembic current
#   python -m alembic upgrade head
#   python -m alembic downgrade -1
#   python -m alembic -x db_url=postgresql://user:pass@host/db upgrade head --sql   (print SQL only)
#
# The database URL comes from server/config.py (env var BUILDAPP_DB_URL).
[alembic]
script_location = migrations
